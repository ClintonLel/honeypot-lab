# Alembic-Konfiguration der Lab-API.
#
# Die Verbindungsdaten stehen absichtlich NICHT hier, sondern kommen aus den
# Umgebungsvariablen (app/migrations/env.py). So liegt kein Passwort im Repo.
# Für einen Trockenlauf ohne Datenbank:
#   alembic -x url=postgresql+psycopg://u:p@localhost/db upgrade head --sql

[alembic]
script_location = app/migrations
prepend_sys_path = .
path_separator = os
# Dateiname der Revisionen: 0001_beschreibung.py
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

# Ohne diesen Eintrag läuft "alembic upgrade head" stumm durch: Die Meldung,
# welche Revision eingespielt wurde, ist INFO und bliebe am Root-Logger hängen.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
