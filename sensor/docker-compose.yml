# Honeypot-Lab: Dienste auf dem Sensor
#
# Schritt 2.2: cowrie-a (klassische Shell), Schritt 4.2: vector,
# Schritt 7.3: cowrie-b (LLM-Backend mit Patch, noch ohne Verkehr).
# Vorbereitung und Befehle: sensor/README.md

name: honeypot

x-cowrie: &cowrie
  image: cowrie/cowrie:3.0.14@sha256:f6ea2e847a1837794cd570322a25a9da819824c70a718600fa6de4c1eba66626
  network_mode: host
  user: "999:999"
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  mem_limit: 512m
  pids_limit: 256
  cpus: 1.0
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  cowrie-a:
    <<: *cowrie
    container_name: cowrie-a
    environment:
      COWRIE_HONEYPOT_SENSOR_NAME: hp-a
      COWRIE_HONEYPOT_BACKEND: shell
      # Nur IPv4, von außen nur über die Umleitung von Port 22 erreichbar (Schritt 2.3)
      COWRIE_SSH_LISTEN_ENDPOINTS: tcp:2222:interface=0.0.0.0
    volumes:
      - ./cowrie:/cowrie/cowrie-git/etc:ro
      - ./persona:/cowrie/persona:ro
      - /srv/honeypot/persona/fs.pickle:/cowrie/fs.pickle:ro
      - /srv/honeypot/hostkeys:/cowrie/hostkeys:ro
      - /srv/honeypot/a/var:/cowrie/cowrie-git/var

  # Variante B: Cowries LLM-Backend mit dem Patch aus E-041 (Schritt 7.3,
  # E-044). Dasselbe Basis-Image wie cowrie-a, siehe cowrie-b/Dockerfile.
  # Verkehr bekommt B erst mit Schritt 7.4: Bis dahin leitet nftables Port 22
  # nur auf cowrie-a, 2322 ist in der Hetzner-Firewall zu und per nftables
  # nur über die Umleitung oder vom Sensor selbst erreichbar.
  cowrie-b:
    <<: *cowrie
    # Lokal gebaut, nie aus einer Registry: "localhost/" lässt sich nicht
    # von Docker Hub auflösen, pull_policy baut immer aus cowrie-b/.
    image: localhost/honeypot-lab/cowrie-b:3.0.14-lab.1
    build:
      context: ./cowrie-b
    pull_policy: build
    container_name: cowrie-b
    environment:
      COWRIE_HONEYPOT_SENSOR_NAME: hp-b
      COWRIE_HONEYPOT_BACKEND: llm
      # Nur IPv4 wie cowrie-a. Erreichbar erst über die Zuteilung (7.4).
      COWRIE_SSH_LISTEN_ENDPOINTS: tcp:2322:interface=0.0.0.0
      # Das LLM-Gateway auf dem Hauptserver (E-008, E-043). Das Token setzt
      # cowrie-b/lab/launch.py aus /run/secrets/llm, den Prompt aus
      # persona/prompt.md. Modell, max_tokens und temperature setzt das Gateway.
      COWRIE_LLM_HOST: https://api.tomkaufmann.dev
      COWRIE_LLM_PATH: /v1/chat/completions
      # Länger als das Zeitlimit des Gateways (höchstens 55 s), kürzer als
      # Cowries 60 s für Exec-Sitzungen (E-044, method.md 4.5).
      COWRIE_LLM_REQUEST_TIMEOUT: "58"
      # Cowries Begrenzung je Adresse, ausdrücklich gesetzt (method.md 4.5).
      # Der Wert für den Start steht noch aus.
      COWRIE_LLM_RATE_LIMIT_REQUESTS: "20"
      COWRIE_LLM_RATE_LIMIT_WINDOW: "60"
      # An, schriebe Cowrie Prompts und Antworten in sein Log.
      COWRIE_LLM_DEBUG: "false"
    volumes:
      - ./cowrie:/cowrie/cowrie-git/etc:ro
      - ./persona:/cowrie/persona:ro
      - /srv/honeypot/persona/fs.pickle:/cowrie/fs.pickle:ro
      - /srv/honeypot/hostkeys:/cowrie/hostkeys:ro
      - /srv/honeypot/b/var:/cowrie/cowrie-git/var
      # Nur das Gateway-Token, eine Datei. Vector sieht dieses Verzeichnis nicht.
      - /srv/honeypot/secrets-b:/run/secrets/llm:ro

  # Liest die Cowrie-Logs und liefert sie an die Lab-API (E-005, Schritt 4.2).
  # Keine eingehende Verbindung, kein Port, nur ausgehend nach
  # https://api.tomkaufmann.dev/ingest (E-007).
  vector:
    image: timberio/vector:0.58.0-alpine@sha256:5dcf67db0ee378caa87f3395cb9484ebe3e97bb0334d119f2ac33116e00c5773
    container_name: vector
    # Dieselbe ID wie Cowrie, sonst kommt Vector nicht an die Logs: Die
    # Verzeichnisse unter /srv/honeypot sind 0700 und gehören 999:999.
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 128
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      VECTOR_CONFIG: /etc/vector/vector.yaml
      # Begrenzt, wie oft Vector dieselbe eigene Meldung wiederholt. Ohne das
      # füllt eine hängende Verbindung das Containerlog.
      VECTOR_INTERNAL_LOG_RATE_LIMIT: "10"
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      # Das Ingest-Token, eine Datei je Geheimnis. Nur lesend, und es steht
      # damit nicht in der Umgebung des Containers.
      - /srv/honeypot/secrets:/run/secrets/lab:ro
      # Nur die Logs, lesend. Host-Keys und fs.pickle sieht Vector nicht.
      - /srv/honeypot/a/var/log/cowrie:/srv/honeypot/a/var/log/cowrie:ro
      - /srv/honeypot/b/var/log/cowrie:/srv/honeypot/b/var/log/cowrie:ro
      # Positionsmerker und Plattenpuffer.
      - /srv/honeypot/vector:/var/lib/vector
    depends_on:
      - cowrie-a
