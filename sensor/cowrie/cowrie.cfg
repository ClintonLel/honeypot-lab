# Honeypot-Lab: gemeinsame Cowrie-Konfiguration für cowrie-a und cowrie-b
#
# Enthält nur Werte, die von der cowrie.cfg.dist im Image (Cowrie 3.0.14)
# abweichen oder bewusst festgehalten werden. Was nur eine Variante betrifft
# (sensor_name, Port, Backend), steht als Umgebungsvariable in
# sensor/docker-compose.yml. Die Persona-Werte stammen aus sensor/persona/persona.md.

[honeypot]
hostname = bld-ci-03
contents_path = /cowrie/persona/honeyfs
txtcmds_path = /cowrie/persona/txtcmds
# 10 MiB
download_limit_size = 10485760
timezone = UTC
ttylog = true

[shell]
filesystem = /cowrie/fs.pickle
processes = /cowrie/persona/cmdoutput.json
arch = linux-x64-lsb
kernel_version = 6.12.107+deb13-amd64
kernel_build_string = #1 SMP PREEMPT_DYNAMIC Debian 6.12.107-1 (2026-08-29)
hardware_platform = x86_64
operating_system = GNU/Linux
ssh_version = OpenSSH_10.0p2 Debian-7+deb13u4, OpenSSL 3.5.7 9 Jun 2026

[ssh]
version = SSH-2.0-OpenSSH_10.0p2 Debian-7+deb13u4
# Dieselben Host-Keys für beide Varianten (E-002), erzeugt von prepare-host.sh
rsa_public_key = /cowrie/hostkeys/ssh_host_rsa_key.pub
rsa_private_key = /cowrie/hostkeys/ssh_host_rsa_key
ecdsa_public_key = /cowrie/hostkeys/ssh_host_ecdsa_key.pub
ecdsa_private_key = /cowrie/hostkeys/ssh_host_ecdsa_key
ed25519_public_key = /cowrie/hostkeys/ssh_host_ed25519_key.pub
ed25519_private_key = /cowrie/hostkeys/ssh_host_ed25519_key
# SFTP und direct-tcpip bleiben an (E-017). forward_redirect und
# forward_tunnel bleiben aus (AGENTS.md, Harte Regeln). Weiterleitungen
# werden damit nur protokolliert, nie ausgeführt (E-017).
sftp_enabled = true
forwarding = true
forward_redirect = false
forward_tunnel = false

[telnet]
enabled = false

[output_jsonlog]
enabled = true
