name: CI

# Nur prüfen, nicht ausrollen: Auf den Hauptserver kommt der Code per rsync vom
# Laptop (E-017), und der Hauptserver verbindet sich nie zum Sensor.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Ohne Deploy-Job ist Abbrechen gefahrlos: Ein neuer Push auf denselben Branch
  # ersetzt den alten Lauf.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions auf den Commit gepinnt, nicht auf den Tag: Ein Tag lässt sich
# verschieben, ein Commit-Hash nicht. Der Kommentar nennt die Version dahinter.

jobs:
  server:
    name: Server testen (mit PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Dasselbe Image wie in docker-compose.server.yml, damit Migration und
        # Round-Trip gegen die Version laufen, die auch im Betrieb läuft.
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          # Wegwerf-Datenbank, lebt nur für diesen Lauf und ist nur auf dem
          # Runner erreichbar. Kein Secret.
          POSTGRES_USER: honeypot
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: honeypot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U honeypot -d honeypot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LAB_TEST_DATABASE_URL: postgresql+psycopg://honeypot:ci-only@localhost:5432/honeypot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Wie im Betrieb (E-010).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - run: python -m pip install -r requirements-dev.txt
        working-directory: server

      # Übersprungene Tests lassen den Job scheitern. Sonst bliebe er grün, wenn
      # die Datenbank einmal nicht erreichbar ist, und die Datenbanktests liefen
      # still nicht mehr mit.
      - name: pytest
        working-directory: server
        run: |
          set -euo pipefail
          python -m pytest -rs -p no:cacheprovider | tee "$RUNNER_TEMP/pytest.log"
          if grep -q '^SKIPPED' "$RUNNER_TEMP/pytest.log"; then
            echo "::error::Tests übersprungen, siehe Zusammenfassung oben"
            exit 1
          fi

  sensor:
    name: Sensor testen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # PyYAML braucht ein Teil der Tests für die Compose- und Vector-Dateien,
      # ohne es werden sie übersprungen. pytest wie in server/requirements-dev.txt.
      - run: python -m pip install pytest==9.1.1 pyyaml==6.0.3

      - name: pytest
        run: |
          set -euo pipefail
          python -m pytest -rs -p no:cacheprovider sensor/tests | tee "$RUNNER_TEMP/pytest.log"
          if grep -q '^SKIPPED' "$RUNNER_TEMP/pytest.log"; then
            echo "::error::Tests übersprungen, siehe Zusammenfassung oben"
            exit 1
          fi

  secrets:
    name: Auf Geheimnisse prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Wie im Website-Demo-Repo: feste Version plus Digest des Release-Artefakts,
      # damit ein ausgetauschtes Binary auffällt.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Die ganze Historie: Ein Schlüssel, der eingecheckt und später wieder
          # entfernt wurde, steckt weiter in alten Commits.
          fetch-depth: 0

      - name: gitleaks holen
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          tar xzf "$asset" gitleaks
          ./gitleaks version

      # --redact, damit ein Fund nicht im öffentlich lesbaren Log landet.
      - name: Historie scannen
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml .
